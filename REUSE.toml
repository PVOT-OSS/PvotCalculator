version = 1
SPDX-PackageName = "Calculator"
SPDX-PackageSupplier = "Saalim Quadri"
SPDX-PackageDownloadLocation = "https://github.com/PVOT-OSS/PvotCalculator"

[[annotations]]
path = [".gitignore", "app/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".github/workflows/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The LineageOS Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["gradle/wrapper/**", "gradlew*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["app/src/main/res/font/sora_*.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019 The Sora Project Authors"
SPDX-License-Identifier = "OFL-1.1"
