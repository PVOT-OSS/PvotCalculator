name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: ./gradlew assembleDebug

    - uses: actions/upload-artifact@v6
      with:
        name: ExactCalculator-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
